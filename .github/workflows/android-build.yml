name: Android debug APK

on:
  push:
    branches: [feat/android-phone-tablet]
    paths:
      - "apps/cadcraft-android/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/cadcraft-android/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only the newest commit on this branch needs an Android build; cancel stale queued/running jobs.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Verify engine command registry inventory
        run: cargo test --locked -p cadcraft-engine --lib command_registry_has_389_unique_ids
      - name: Verify UI-only command inventory
        run: cargo test --locked -p cadcraft-ui-egui --lib ui_command_ids_are_unique_and_match_the_source_index
      - name: Run canvas touch input regression tests
        run: "cargo test -p cadcraft-ui-egui --lib canvas::"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build native library
        run: cargo ndk -t arm64-v8a -o apps/cadcraft-android/app/src/main/jniLibs build --release --locked -p cadcraft-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble APK
        working-directory: apps/cadcraft-android
        run: gradle --no-daemon assembleDebug
      - name: Validate APK package
        run: |
          python3 - <<'PY'
          import pathlib
          import zipfile

          apk = pathlib.Path("apps/cadcraft-android/app/build/outputs/apk/debug/app-debug.apk")
          if not apk.is_file() or apk.stat().st_size < 10_000_000:
              raise SystemExit("APK is missing or unexpectedly small")
          with zipfile.ZipFile(apk) as package:
              names = set(package.namelist())
              if "AndroidManifest.xml" not in names:
                  raise SystemExit("APK has no AndroidManifest.xml")
              if not any(name.startswith("classes") and name.endswith(".dex") for name in names):
                  raise SystemExit("APK has no DEX bytecode")
              native = {name for name in names if name.startswith("lib/") and name.endswith(".so")}
              if "lib/arm64-v8a/libmain.so" not in native:
                  raise SystemExit("APK is missing the ARM64 CADCraft native library")
              if any(not name.startswith("lib/arm64-v8a/") for name in native):
                  raise SystemExit(f"Unexpected native ABI in APK: {sorted(native)}")
              bad = package.testzip()
              if bad:
                  raise SystemExit(f"Corrupt APK entry: {bad}")
          print(f"Validated {apk} ({apk.stat().st_size} bytes)")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cadcraft-android-arm64-debug
          path: apps/cadcraft-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
