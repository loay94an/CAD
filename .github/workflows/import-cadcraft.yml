name: Import CADCraft source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-cadcraft.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Copy complete CADCraft source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/storytold/cadcraft.git /tmp/cadcraft
          SOURCE_SHA="$(git -C /tmp/cadcraft rev-parse HEAD)"
          rsync -a --exclude='.git' /tmp/cadcraft/ ./
          rm -f .github/workflows/import-cadcraft.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import CADCraft source snapshot (${SOURCE_SHA})"
          git push origin HEAD:main
