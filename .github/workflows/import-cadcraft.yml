name: Import CADCraft source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-cadcraft.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Import complete CADCraft snapshot without changing workflow permissions
        shell: bash
        run: |
          set -euo pipefail
          if [ -f CADCRAFT_IMPORT_COMPLETE ]; then
            echo "CADCraft source was already imported."
            exit 0
          fi
          git clone --depth 1 https://github.com/storytold/cadcraft.git /tmp/cadcraft
          SOURCE_SHA="$(git -C /tmp/cadcraft rev-parse HEAD)"
          rsync -a --exclude='.git' --exclude='.github/workflows/**' /tmp/cadcraft/ ./
          mkdir -p cadcraft-upstream-workflows
          cp -a /tmp/cadcraft/.github/workflows/. cadcraft-upstream-workflows/
          printf 'Source: https://github.com/storytold/cadcraft\nCommit: %s\nImported at: %s\n' "$SOURCE_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > CADCRAFT_IMPORT_COMPLETE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import CADCraft source snapshot ($SOURCE_SHA)"
          git push origin HEAD:main
